<!-- _layouts/default.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <!-- SEO (opcional si usas jekyll-seo-tag) -->
  {% if site.plugins contains "jekyll-seo-tag" %}
    {% seo %}
  {% endif %}

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RJ7x0RSJo7LFp+ILy+dN9+nJOZ8+" crossorigin="anonymous">

  <!-- Estilos propios -->
  <link href="{{ '/assets/css/custom.css' | relative_url }}" rel="stylesheet">
</head>
<body>

  {% include navbar.html %}

  <main class="py-4">
    <div class="container">
        {% if page.title %}
        <h1 class="mb-4">{{ page.title }}</h1>
      {% endif %}
      {{ content }}
    </div>
  </main>

  <footer class="bg-light border-top py-3 mt-auto">
    <div class="container text-muted small">
      © {{ site.time | date: "%Y" }} · {{ site.title }}
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle (incluye Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
          crossorigin="anonymous"></script>
</body>
</html>
